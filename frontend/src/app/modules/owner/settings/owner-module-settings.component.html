<div *ngIf="loading()" class="oms-state" role="status">
  <span class="oms-spinner" aria-hidden="true"></span>
  Loading module settings…
</div>

<div *ngIf="!loading() && !mosque()" class="oms-alert oms-alert--warn">
  No mosque linked. Complete claim approval to manage modules.
</div>

  <div *ngIf="!loading() && mosque()">
  <div *ngIf="toast()" class="oms-toast" [class.oms-toast--ok]="toastOk()" [class.oms-toast--err]="!toastOk()">{{ toast() }}</div>
  <div *ngIf="lockMessage()" class="oms-alert" [class.oms-alert--warn]="!canEdit()" [class.oms-alert--info]="canEdit() || mosque()?.status !== 'Active'">{{ lockMessage() }}</div>

  <p class="oms-lead">Enable or disable modules for your mosque. Disabled modules are hidden from your dashboard and the public website.</p>

  <ul class="oms-list" [class.oms-list--locked]="!canEdit()">
    <li *ngFor="let mod of sortedModules()" class="oms-row">
      <div>
        <p class="oms-row__name">{{ moduleLabel(mod.moduleKey) }}</p>
        <p class="oms-row__key">{{ mod.moduleKey }}</p>
      </div>
      <button
        type="button"
        class="oms-toggle"
        [class.oms-toggle--on]="mod.isEnabled"
        [attr.aria-pressed]="mod.isEnabled"
        [disabled]="!canEdit() || saving()"
        (click)="toggle(mod)">
        <span class="oms-toggle__knob" aria-hidden="true"></span>
        <span class="oms-toggle__label">{{ mod.isEnabled ? 'ON' : 'OFF' }}</span>
      </button>
    </li>
  </ul>

  <footer class="oms-footer">
    <button type="button" class="oms-btn" (click)="saveAll()" [disabled]="!canEdit() || saving()">
      <span *ngIf="saving()" class="oms-spinner oms-spinner--sm" aria-hidden="true"></span>
      {{ saving() ? 'Saving…' : 'Save Module Settings' }}
    </button>
  </footer>
</div>
