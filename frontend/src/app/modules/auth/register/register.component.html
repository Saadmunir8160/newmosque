<div class="auth-page">
      <img class="bg-image" src="https://images.unsplash.com/photo-1564769625905-50e93615e769?auto=format&fit=crop&q=85&w=1400" alt="">
      <div class="bg-overlay"></div>
      <div class="pattern-right" aria-hidden="true"></div>
      <div class="vignette"></div>

      <div class="float-shape float-shape--1" aria-hidden="true"></div>
      <div class="float-shape float-shape--2" aria-hidden="true"></div>
      <div class="float-shape float-shape--3" aria-hidden="true"></div>
      <div class="float-shape float-shape--4" aria-hidden="true"></div>

      <div class="brand-seal" aria-hidden="true">
        <span>✦</span>
        MosqueOS
      </div>

      <div class="auth-inner">
        <div class="moon-wrap" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5A9.5 9.5 0 1 1 10.5 3 7.5 7.5 0 1 0 21 15.5z"/></svg>
        </div>

        <h1 class="auth-title-line">
          Create Account
          <span class="auth-title-gold">to MosqueOS</span>
        </h1>
        <p class="auth-sub">Register to get started</p>

        <div *ngIf="error()" class="error-box" role="alert">
          <span class="error-icon">!</span>
          <span>{{ error() }}</span>
        </div>


        <div class="hp-field" aria-hidden="true">
          <input type="text" tabindex="-1" autocomplete="username">
          <input type="password" tabindex="-1" autocomplete="current-password">
        </div>

        <form id="login-form" autocomplete="off" (ngSubmit)="onRegister()" data-form-type="other">
          <div class="field">
            <div class="field-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              </span>
              <input class="input-wrap" [class.input-wrap--error]="fieldErrors()['fullName']"
                type="text" id="mosqueos-register-name" name="fullName" placeholder=" "
                autocomplete="name"
                [(ngModel)]="fullName" (ngModelChange)="clearField('fullName')">
              <label for="mosqueos-register-name" class="floating-label">Full Name</label>
            </div>
            <div *ngIf="fieldErrors()['fullName']" style="color:#fca5a5; font-size:0.75rem; margin-top:0.25rem; padding-left:0.5rem;">{{ fieldErrors()['fullName'] }}</div>
          </div>

          <div class="field">
            <div class="field-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg>
              </span>
              <input class="input-wrap" [class.input-wrap--error]="fieldErrors()['email']"
                type="text" id="mosqueos-register-email"
                name="email" placeholder=" "
                autocomplete="email" autocapitalize="off" spellcheck="false"
                data-lpignore="true" data-1p-ignore data-bwignore
                (keydown.enter)="$event.preventDefault()"
                [(ngModel)]="email" (ngModelChange)="clearField('email')">
              <label for="mosqueos-register-email" class="floating-label">Email</label>
            </div>
          </div>

          <div class="field">
            <div class="pass-row">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3z"/></svg>
              </span>
              <input class="input-wrap" [class.input-wrap--error]="fieldErrors()['password']" [class.pass-mask]="!showPassword()"
                [type]="showPassword() ? 'text' : 'text'"
                id="mosqueos-register-pass" name="password"
                placeholder=" " autocomplete="new-password"
                data-lpignore="true" data-1p-ignore data-bwignore
                (keydown.enter)="$event.preventDefault(); onRegister()"
                [(ngModel)]="password" (ngModelChange)="clearField('password')">
              <label for="mosqueos-register-pass" class="floating-label">Password</label>
              <button type="button" class="pass-toggle" (click)="showPassword.set(!showPassword())" tabindex="-1" aria-label="Toggle password">
                <svg *ngIf="!showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg *ngIf="showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <div *ngIf="fieldErrors()['password']" style="color:#fca5a5; font-size:0.75rem; margin-top:0.25rem; padding-left:0.5rem;">{{ fieldErrors()['password'] }}</div>
          </div>

          <div class="field">
            <div class="pass-row">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3z"/></svg>
              </span>
              <input class="input-wrap" [class.input-wrap--error]="fieldErrors()['confirmPassword']" [class.pass-mask]="!showConfirmPassword()"
                [type]="showConfirmPassword() ? 'text' : 'text'"
                id="mosqueos-register-confirm" name="confirmPassword"
                placeholder=" " autocomplete="new-password"
                [(ngModel)]="confirmPassword" (ngModelChange)="clearField('confirmPassword')">
              <label for="mosqueos-register-confirm" class="floating-label">Confirm Password</label>
              <button type="button" class="pass-toggle" (click)="showConfirmPassword.set(!showConfirmPassword())" tabindex="-1" aria-label="Toggle password">
                <svg *ngIf="!showConfirmPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg *ngIf="showConfirmPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>

            <div *ngIf="fieldErrors()['confirmPassword']" style="color:#fca5a5; font-size:0.75rem; margin-top:0.25rem; padding-left:0.5rem;">{{ fieldErrors()['confirmPassword'] }}</div>
          </div>

          

          <div class="meta-row" style="margin-bottom: 1.5rem;">
            <label class="remember">
              <input type="checkbox" [(ngModel)]="acceptedTerms" name="acceptedTerms" (ngModelChange)="clearField('acceptedTerms')">
              I agree to the Terms & Conditions
            </label>
            <div *ngIf="fieldErrors()['acceptedTerms']" style="color:#fca5a5; font-size:0.75rem; margin-top:0.25rem; width: 100%;">{{ fieldErrors()['acceptedTerms'] }}</div>
          </div>

          <button type="submit" class="btn-login" [disabled]="submitting()">
            <span *ngIf="submitting()" class="auth-spinner" aria-hidden="true"></span>
            {{ submitting() ? 'Creating Account…' : 'Register' }}
          </button>
        </form>

        <p class="auth-footer">
          Already have an account? <a routerLink="/auth/login">Log In</a>
        </p>
      </div>
    </div>
