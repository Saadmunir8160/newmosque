<div *ngIf="open" class="seed-backdrop" (click)="closed.emit()" role="presentation">
  <aside
    class="seed-drawer"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="add-mosque-title">

    <header class="seed-drawer__header">
      <div>
        <p class="seed-drawer__eyebrow">Super Admin · Mosque Listings</p>
        <h2 id="add-mosque-title">{{ editMosque ? 'Edit Mosque' : 'Add Mosque' }}</h2>
        <p class="seed-drawer__lead">{{ editMosque ? 'Update the details for this mosque.' : 'Create an unclaimed listing before an owner claims it.' }}</p>
      </div>
      <button type="button" class="seed-drawer__close" (click)="closed.emit()" aria-label="Close">✕</button>
    </header>

    <div class="seed-drawer__body">
      <app-mosque-seed-form
        [editMosque]="editMosque"
        (cancelled)="closed.emit()"
        (saved)="onSaved($event)" />
    </div>
  </aside>
</div>
